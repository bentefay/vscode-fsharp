[package]
name = "local-lexical-proof-harness"
version = "0.0.0"
edition = "2021"
[workspace]
[lib]
path = "harness.rs"
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
blake3 = "1"
serde_json = "1"
tree-sitter = "=0.27.2"
tree-sitter-fsharp = "=0.3.13"
[patch.crates-io]
tree-sitter-fsharp = { path = "../../../../vendor/tree-sitter-fsharp" }
[[bin]]
name = "local-lexical-probe"
path = "probe.rs"
