[workspace]
members = ["crates/navigator-core", "crates/navigator-daemon"]
exclude = ["vendor/tree-sitter-fsharp"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
postcard = { version = "=1.2.0", default-features = false, features = ["alloc"] }
unicode-ident = "1"
sha2 = "0.10"
rusqlite = { version = "=0.43.0", features = ["bundled", "fallible_uint"] }
walkdir = "2"
quick-xml = "=0.42.0"
notify = "=8.2.2"
url = "=2.5.9"
percent-encoding = "=2.3.2"
libc = "=0.2.191"

[patch.crates-io]
tree-sitter-fsharp = { path = "vendor/tree-sitter-fsharp" }

[profile.release]
lto = "thin"
strip = true

