[workspace]
members = ["crates/navigator-core", "crates/navigator-daemon"]
exclude = ["vendor/tree-sitter-fsharp"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
bincode = "=1.3.3"
unicode-ident = "1"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
quick-xml = "0.37"
notify = "7"
url = "2"
libc = "=0.2.191"

[patch.crates-io]
tree-sitter-fsharp = { path = "vendor/tree-sitter-fsharp" }

[profile.release]
lto = "thin"
strip = true

